# Enable split keyboard support & BLE split transport
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Bluetooth transmit power (+8 dBm for stronger split & host connection)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable deep sleep support (timeout: 30 minutes = 1,800,000 ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Battery level reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Experimental BLE connectivity improvements for Windows/Mac
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
