CONFIG_ZMK_KEYBOARD_NAME="ErgoDox TP"
CONFIG_BT_DEVICE_NAME_MAX=32

# Enable split peripheral role
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Pointing device and input driver
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_I2C=y
CONFIG_SYNAPTICS_TM_P3125=y

# Wireless transmission power (+8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Experimental BLE connectivity improvements & Low Latency (7.5ms interval = 133Hz)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_CTLR_PHY_2M=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Power management (disabled during debugging)
CONFIG_ZMK_SLEEP=n

# Logging settings (activated when zmk-usb-logging snippet is enabled)
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000
CONFIG_LOG_BUFFER_SIZE=8192

