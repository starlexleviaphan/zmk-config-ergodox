# ZMK Dongle configuration
CONFIG_ZMK_KEYBOARD_NAME="ErgoDox"

# Enable split & BLE split central role with 3 split peripherals (Left, Right halves & Touchpad)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3
CONFIG_BT_MAX_CONN=8
CONFIG_BT_MAX_PAIRED=8

# Enable Pointing Device support (Mouse / Trackpad HID endpoint)
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y

# Wireless transmission power (+8 dBm for strong stable link)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Experimental BLE connectivity improvements
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Internal RC oscillator for nRF52 (fixes LF clock drift on SuperMini / clones)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

# Dongle plugged into USB host: never sleep
CONFIG_ZMK_SLEEP=n

# ZMK Studio Support (on-the-fly keymap configuration over USB)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Battery level reporting & proxying for split peripherals
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# USB Polling rate (1000 Hz / 1ms response)
CONFIG_USB_HID_POLL_INTERVAL_MS=1

# HID Indicators (Caps Lock / Num Lock / Scroll Lock state reporting)
CONFIG_ZMK_HID_INDICATORS=y

# Windows GATT subscription fix
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# Headroom for high-bandwidth split peripheral input streams
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_RX_COUNT=10



# --- DISPLAY & YADS MODULE ---
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n

# Backlight
CONFIG_LED=y
CONFIG_PWM=y

# YADS Widgets Configuration
CONFIG_DONGLE_SCREEN_HORIZONTAL=y
CONFIG_DONGLE_SCREEN_FLIPPED=y
CONFIG_DONGLE_SCREEN_SYSTEM_ICON=2
CONFIG_DONGLE_SCREEN_OUTPUT_ACTIVE=y
CONFIG_DONGLE_SCREEN_LAYER_ACTIVE=y
CONFIG_DONGLE_SCREEN_BATTERY_ACTIVE=y
CONFIG_DONGLE_SCREEN_WPM_ACTIVE=y
CONFIG_ZMK_WPM=y
CONFIG_DONGLE_SCREEN_MODIFIER_ACTIVE=y
CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=600
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=80

# Persist dongle display preferences (NVS settings backend)
CONFIG_SETTINGS=y

# Enable LVGL widgets for Speedometer Arc
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_BAR=y
