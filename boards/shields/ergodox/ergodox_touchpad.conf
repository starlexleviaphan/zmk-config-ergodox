CONFIG_ZMK_KEYBOARD_NAME="ErgoDox Touchpad"

# Enable split peripheral role
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Pointing device and split input forwarding
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SPLIT_POINTING_INPUT=y
CONFIG_INPUT=y
CONFIG_I2C=y
CONFIG_SYNAPTICS_TM_P3125=y

# Wireless transmission power (+8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Experimental BLE connectivity improvements
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Power management and deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
